name: Voidstrap APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        run: |
          curl -L -o app.apk https://github.com/stevequezada34-cell/VoidstrapAPK/releases/download/v1.0/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidstrapAPK
          path: app.apk
