name: Build Voidstrap Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/android-actions/sdk:latest

    steps:
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/voidstrap/android
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > app/src/main/java/com/voidstrap/android/MainActivity.java << 'EOF'
          package com.voidstrap.android;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.InputStream;
          public class MainActivity extends AppCompatActivity {
              private EditText flagInput;
              private Button injectBtn;
              private TextView statusText;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  flagInput = findViewById(R.id.flagInput);
                  injectBtn = findViewById(R.id.injectBtn);
                  statusText = findViewById(R.id.statusText);
                  injectBtn.setOnClickListener(v -> {
                      String flags = flagInput.getText().toString();
                      if (flags.isEmpty()) {
                          Toast.makeText(MainActivity.this, "Enter JSON flags!", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      try {
                          InputStream is = getAssets().open("inject.lua");
                          byte[] buffer = new byte[is.available()];
                          is.read(buffer);
                          is.close();
                          String luaScript = new String(buffer, "UTF-8");
                          String finalScript = luaScript.replace("[[FLAGS_JSON]]", flags);
                          android.content.ClipboardManager clipboard = (android.content.ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                          android.content.ClipData clip = android.content.ClipData.newPlainText("Lua Script", finalScript);
                          clipboard.setPrimaryClip(clip);
                          statusText.setText("✅ Script copied to clipboard!");
                          Toast.makeText(MainActivity.this, "Lua script copied!", Toast.LENGTH_LONG).show();
                      } catch (Exception e) {
                          statusText.setText("❌ Error: " + e.getMessage());
                          Toast.makeText(MainActivity.this, "Error: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                      }
                  });
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp"
              android:gravity="center">
              <TextView android:text="Voidstrap Android"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:textColor="#00BCD4"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginBottom="20dp"/>
              <TextView android:text="Paste your FFlags JSON:"
                  android:textSize="16sp"
                  android:textColor="#FFFFFF"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"/>
              <EditText android:id="@+id/flagInput"
                  android:hint='{"FFlagDebugSkyGray": true}'
                  android:textSize="14sp"
                  android:background="#333333"
                  android:textColor="#FFFFFF"
                  android:hintTextColor="#888888"
                  android:padding="12dp"
                  android:minHeight="120dp"
                  android:gravity="top"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"/>
              <Button android:id="@+id/injectBtn"
                  android:text="INJECT FLAGS"
                  android:textSize="18sp"
                  android:backgroundTint="#00BCD4"
                  android:textColor="#000000"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:layout_marginTop="20dp"/>
              <TextView android:id="@+id/statusText"
                  android:text="Ready"
                  android:textSize="14sp"
                  android:textColor="#FFFFFF"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="20dp"
                  android:gravity="center"/>
          </LinearLayout>
          EOF

          cat > app/src/main/assets/inject.lua << 'EOF'
          local flags = [[FLAGS_JSON]]
          local success, data = pcall(function()
              return game:GetService("HttpService"):JSONDecode(flags)
          end)
          if success and type(data) == "table" then
              for key, value in pairs(data) do
                  pcall(function()
                      setfflag(key, tostring(value))
                      print("[Voidstrap] Set " .. key .. " = " .. tostring(value))
                  end)
              end
              print("[Voidstrap] All flags injected successfully!")
          else
              warn("[Voidstrap] Invalid JSON format!")
          end
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.voidstrap.android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Voidstrap Android"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build APK
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
              namespace 'com.voidstrap.android'
              compileSdk 33
              defaultConfig {
                  applicationId 'com.voidstrap.android'
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > settings.gradle << 'EOF'
          rootProject.name = 'VoidstrapAndroid'
          include ':app'
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidstrapAndroid
          path: app/build/outputs/apk/debug/*.apk
