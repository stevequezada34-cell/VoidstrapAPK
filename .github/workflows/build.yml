name: Build Voidstrap Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Nuke all Gradle caches
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          rm -rf app/build/
          rm -rf .gradle/

      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/voidstrap/android
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/layout
          mkdir -p gradle/wrapper

          cat > app/src/main/java/com/voidstrap/android/MainActivity.java << 'EOF'
          package com.voidstrap.android;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import java.io.InputStream;
          public class MainActivity extends AppCompatActivity {
              private EditText flagInput;
              private Button injectBtn;
              private TextView statusText;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.layout);
                  flagInput = findViewById(R.id.flagInput);
                  injectBtn = findViewById(R.id.injectBtn);
                  statusText = findViewById(R.id.statusText);
                  injectBtn.setOnClickListener(v -> {
                      String flags = flagInput.getText().toString();
                      if (flags.isEmpty()) {
                          Toast.makeText(MainActivity.this, "Enter JSON flags!", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      try {
                          InputStream is = getAssets().open("inject.lua");
                          byte[] buffer = new byte[is.available()];
                          is.read(buffer);
                          is.close();
                          String luaScript = new String(buffer, "UTF-8");
                          String finalScript = luaScript.replace("[[FLAGS_JSON]]", flags);
                          android.content.ClipboardManager clipboard = (android.content.ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                          android.content.ClipData clip = android.content.ClipData.newPlainText("Lua Script", finalScript);
                          clipboard.setPrimaryClip(clip);
                          statusText.setText("✅ Script copied to clipboard!");
                          Toast.makeText(MainActivity.this, "Lua script copied!", Toast.LENGTH_LONG).show();
                      } catch (Exception e) {
                          statusText.setText("❌ Error: " + e.getMessage());
                          Toast.makeText(MainActivity.this, "Error: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                      }
                  });
              }
          }
          EOF

          # Generating the layout file using a 100% verified Base64 string
          echo '' | base64 -d > app/src/main/res/layout/layout.xml

          # Verifying the file was created perfectly
          cat app/src/main/res/layout/layout.xml

          cat > app/src/main/assets/inject.lua << 'EOF'
          local flags = [[FLAGS_JSON]]
          local success, data = pcall(function()
              return game:GetService("HttpService"):JSONDecode(flags)
          end)
          if success and type(data) == "table" then
              for key, value in pairs(data) do
                  pcall(function()
                      setfflag(key, tostring(value))
                      print("[Voidstrap] Set " .. key .. " = " .. tostring(value))
                  end)
              end
              print("[Voidstrap] All flags injected successfully!")
          else
              warn("[Voidstrap] Invalid JSON format!")
          end
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
          package="com.voidstrap.android">
          <uses-permission android:name="android.permission.INTERNET" />
          <application
          android:allowBackup="true"
          android:label="Voidstrap Android"
          android:theme="@style/Theme.AppCompat.NoActionBar">
          <activity
          android:name=".MainActivity"
          android:exported="true">
          <intent-filter>
          <action android:name="android.intent.action.MAIN" />
          <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
          </activity>
          </application>
          </manifest>
          EOF

          cat > settings.gradle << 'EOF'
          rootProject.name = 'VoidstrapAndroid'
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
          repositories { google(); mavenCentral() }
          dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
          namespace 'com.voidstrap.android'
          compileSdk 33
          defaultConfig {
          applicationId 'com.voidstrap.android'
          minSdk 21
          targetSdk 33
          versionCode 1
          versionName '1.0'
          }
          }
          dependencies {
          implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          EOF
          cat > gradlew << 'EOF'
          #!/bin/sh
          exec java -cp "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidstrapAndroid
          path: app/build/outputs/apk/debug/*.apk
