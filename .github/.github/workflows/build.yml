name: Build Voidstrap APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android template
        uses: actions/checkout@v4
        with:
          repository: android/ndk-samples
          path: template

      - name: Copy template and create project
        run: |
          cp -r template/hello-jni/* .
          mkdir -p app/src/main/java/com/voidstrap/app
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/res/layout
          mkdir -p gradle/wrapper

      - name: Download gradle-wrapper.jar
        run: |
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar

      - name: Create gradle-wrapper.properties
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          EOF

      - name: Create gradlew
        run: |
          cat > gradlew << 'EOF'
          #!/bin/sh
          exec java -cp "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew

      - name: Create gradlew.bat
        run: |
          cat > gradlew.bat << 'EOF'
          @if "%DEBUG%" == "" @echo off
          set DIRNAME=%~dp0
          if "%DIRNAME%" == "" set DIRNAME=.
          set APP_BASE_NAME=%~n0
          set APP_HOME=%DIRNAME%
          set CLASSPATH=%APP_HOME%\gradle\wrapper\gradle-wrapper.jar
          "%JAVA_EXE%" -classpath "%CLASSPATH%" org.gradle.wrapper.GradleWrapperMain %*
          EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/voidstrap/app/MainActivity.java << 'EOF'
          package com.voidstrap.app;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              static { System.loadLibrary("voidstrap"); }
              public native void addFlag(String flag, String value);
              public native void inject();
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  Button injectBtn = findViewById(R.id.injectBtn);
                  injectBtn.setOnClickListener(v -> inject());
                  Button addBtn = findViewById(R.id.addBtn);
                  EditText flagInput = findViewById(R.id.flagInput);
                  EditText valueInput = findViewById(R.id.valueInput);
                  addBtn.setOnClickListener(v -> {
                      String flag = flagInput.getText().toString();
                      String value = valueInput.getText().toString();
                      if (!flag.isEmpty()) {
                          addFlag(flag, value);
                          LinearLayout list = findViewById(R.id.flagList);
                          TextView item = new TextView(MainActivity.this);
                          item.setText(flag + " = " + value);
                          list.addView(item);
                      }
                  });
              }
          }
          EOF

      - name: Create voidstrap.cpp
        run: |
          cat > app/src/main/cpp/voidstrap.cpp << 'EOF'
          #include <jni.h>
          #include <string>
          #include <dlfcn.h>
          #include <unordered_map>
          #include <android/log.h>
          #define LOG_TAG "Voidstrap"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)
          static std::unordered_map<std::string, std::string> forceFlags;
          extern "C" JNIEXPORT void JNICALL Java_com_voidstrap_app_MainActivity_addFlag(JNIEnv* env, jobject thiz, jstring flag, jstring value) {
              const char* flagStr = env->GetStringUTFChars(flag, nullptr);
              const char* valueStr = env->GetStringUTFChars(value, nullptr);
              forceFlags[flagStr] = valueStr;
              env->ReleaseStringUTFChars(flag, flagStr);
              env->ReleaseStringUTFChars(value, valueStr);
              LOGI("Added flag: %s = %s", flagStr, valueStr);
          }
          extern "C" JNIEXPORT void JNICALL Java_com_voidstrap_app_MainActivity_inject(JNIEnv* env, jobject thiz) {
              void* handle = dlopen("libRoblox.so", RTLD_NOW);
              if (!handle) { LOGI("Failed to open libRoblox.so"); return; }
              LOGI("Inject successful");
          }
          EOF

      - name: Create activity_main.xml
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">
              <TextView android:text="Voidstrap APK"
                  android:textSize="24sp"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"/>
              <LinearLayout android:orientation="horizontal"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content">
                  <EditText android:id="@+id/flagInput"
                      android:hint="Flag name"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"/>
                  <EditText android:id="@+id/valueInput"
                      android:hint="Value"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"/>
                  <Button android:id="@+id/addBtn"
                      android:text="Add"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"/>
              </LinearLayout>
              <Button android:id="@+id/injectBtn"
                  android:text="INJECT INTO ROBLOX"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"/>
              <ScrollView android:layout_width="match_parent"
                  android:layout_height="match_parent">
                  <LinearLayout android:id="@+id/flagList"
                      android:orientation="vertical"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"/>
              </ScrollView>
          </LinearLayout>
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.voidstrap.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_SUPERUSER" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Voidstrap"
                  android:extractNativeLibs="true"
                  android:theme="@style/Theme.AppCompat.Light">
                  <activity android:name=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.voidstrap.app'
              compileSdk 33
              defaultConfig {
                  applicationId 'com.voidstrap.app'
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
                  externalNativeBuild {
                      cmake {
                          cppFlags '-std=c++17'
                      }
                  }
              }
              externalNativeBuild {
                  cmake {
                      path 'src/main/cpp/CMakeLists.txt'
                  }
              }
          }
          EOF

      - name: Create CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.18.1)
          project("voidstrap")
          add_library(voidstrap SHARED voidstrap.cpp)
          target_link_libraries(voidstrap log dl)
          EOF

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Voidstrap"
          include ':app'
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidstrapAPK
          path: app/build/outputs/apk/debug/*.apk
